# pytest configuration for route-audit.
#
# The canonical test runner is the standard library, because the sandbox must be
# verifiable offline with no third-party dependency:
#
#     python -m unittest discover -s tests -v
#
# This file exists only so that developers who *do* have pytest installed can
# point it at the same suite.  The tests themselves never import pytest; they
# are plain `unittest.TestCase` classes, which pytest collects natively.
#
# Equivalent invocations:
#     pytest                      # uses this file
#     pytest tests -v             # explicit path

[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test* *Tests
python_functions = test_*

# Show a short summary of skips and failures, and don't stop at the first error.
addopts = -ra
